<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jogo</title>
</head>

    <body>
        <h2>Cadastro de jogos</h2>

        <input type="text"  id="nome_jogo"  placeholder="Nome do jogo"
        >
     <!--   <input type="text"  id="desenvolvedor_jogo"  placeholder="Desenvolvedor do jogo">-->
        <select id="categoria_jogo">
            <option value="">Selecione uma categoria
            </option>

            <option value="Educativo"> Educativo
            </option>
            <option value="Estratégia">Estratégia</option>

            <option value="Aventura">Aventura</option>
            <option value="Quebra-cabeça">Quebra-cabeça</option>
            <option value="Esportes">Esportes</option>
        </select>

        <button type="button" id="botao_cadastrar"> Cadastrar jogo</button>

        <div id="area_alterar"></div>

        <h2>Lista de jogos cadastrados</h2>

        <table>
            <tbody id="tabela_jogos">
            </tbody>
        </table>

        <script src="jogo.js"></script>
    </body>
</html>
