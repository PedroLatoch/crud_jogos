<!DOCTYPE html> 
<html lang="pt-BR"> 
<head> 
    <meta charset="UTF-8"> 
    <meta name="viewport" content="width=device-width, initial-scale=1.0"> 
    <title>Jogo</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
</head> 
 
<body class="bg-light"> 

    <div class="container mt-5">

        <div class="card shadow-sm p-4 mb-4">

            <h2 class="mb-4">Cadastro de jogos</h2> 
 
            <div class="row g-3">

                <div class="col-md-5">
                    <input 
                        type="text"  
                        id="nome_jogo"  
                        class="form-control"
                        placeholder="Nome do jogo"
                    > 
                </div>

                <!--
                <input 
                    type="text"  
                    id="desenvolvedor_jogo"  
                    placeholder="Desenvolvedor do jogo"
                >
                -->

               <div class="col-md-4"> 
    <select id="categoria_jogo" class="form-select">  

        <option value=""> 
            Selecione uma categoria 
        </option>  

        <option value="Matemática"> 
            Matemática 
        </option>  

        <option value="Português"> 
            Português 
        </option>  

        <option value="História"> 
            História 
        </option>  

        <option value="Geografia"> 
            Geografia 
        </option>  

        <option value="Ciências"> 
            Ciências 
        </option>  

        <option value="Inglês"> 
            Inglês 
        </option>  

        <option value="Lógica"> 
            Lógica 
        </option>  

        <option value="Programação"> 
            Programação 
        </option>  

    </select> 
</div>
                <div class="col-md-3">
                    <button 
                        type="button" 
                        id="botao_cadastrar"
                        class="btn btn-primary w-100"
                    >
                        Cadastrar jogo
                    </button>
                </div>

            </div>
 
            <div id="area_alterar" class="mt-3"></div>

        </div>
 
        <div class="card shadow-sm p-4">

            <h2 class="mb-4">Lista de jogos cadastrados</h2> 

            <div class="table-responsive">

                <table class="table table-striped table-hover align-middle">

                    <thead class="table-dark">
                        <tr>
                            <th>Nome</th>
                            <th>Categoria</th>
                            <th>Ações</th>
                        </tr>
                    </thead>
 
                    <tbody id="tabela_jogos"> 
                    </tbody> 

                </table>

            </div>

        </div>

    </div>
 
    <script src="jogo.js"></script> 
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>

</body> 
</html>
